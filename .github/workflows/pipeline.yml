name: DevSecOps Pipeline
on: [pull_request]

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: IaC scan (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          quiet: true
          soft_fail: false

      - name: Build image
        run: docker build -t sample-app:${{ github.sha }} ./app

      - name: Container CVE scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: sample-app:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: OPA policy check
        run: |
          docker run --rm -v "$PWD":/project openpolicyagent/conftest test \
            /project/app/k8s-manifest.yaml -p /project/policies/opa

  deploy:
    needs: security-gates
    runs-on: ubuntu-latest
    steps:
      - run: echo "All gates passed — deploy step goes here"
