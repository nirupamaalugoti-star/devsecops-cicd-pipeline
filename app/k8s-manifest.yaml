apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-app
spec:
  replicas: 2
  selector:
    matchLabels: { app: sample-app }
  template:
    metadata:
      labels: { app: sample-app }
    spec:
      containers:
        - name: sample-app
          image: your-repo/sample-app:1.0.0
          resources:
            limits: { cpu: "250m", memory: "256Mi" }
          securityContext:
            privileged: false
